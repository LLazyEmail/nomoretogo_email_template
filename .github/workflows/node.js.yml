# Node.js CI across supported LTS / current lines.
# See https://nodejs.org/en/about/previous-releases

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template

    strategy:
      fail-fast: false
      matrix:
        # 22 = maintenance LTS (Jod), 24 = maintenance LTS (Krypton),
        # 26 = active LTS (Lithium, promoted 2026-10-28)
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: template/package-lock.json
    - run: npm ci
    - run: npm run build --if-present
    # The README notes Jest tests were dropped during the Nx migration; the
    # leftover specs import paths that no longer exist. Keep running them so
    # the output stays visible, but don't fail the build until they are
    # rewritten or removed.
    - run: npm test --if-present
      continue-on-error: true
